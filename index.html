<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Kaohsiung_Weather</title>
    <link rel="icon" type="image/png" href="./meteorology.png" />
    <link rel="apple-touch-icon" href="./meteorology.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./meteorology.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        /* 主題色：鮮明藍色 (朱蒂的警服) */
        --zt-blue-main: #4a90e2;
        /* 背景色：城市清晨的淺灰藍 */
        --zt-bg-light: #f4f6f9;
        /* 卡片背景：乾淨的白色/淺色 */
        --zt-card-bg: #ffffff;
        /* 亮眼對比色 (尼克的襯衫綠/警示色) */
        --zt-green-accent: #8fe05d;
        /* 主要文字/深色 */
        --zt-dark: #333333;
        /* 次要文字/陰影色 */
        --zt-shadow-color: rgba(0, 0, 0, 0.15);

        /* 新增底圖變數  --zt-bg-pattern-base64: url(*/
        --zt-bg-pattern-base64: url("https://www.technice.com.tw/wp-content/uploads/2025/11/%E5%8B%95%E7%89%A9%E6%96%B9%E7%A8%8B%E5%BC%8F2-2.png");
        /* 調整背景色，讓底圖更顯眼，但仍保持 Zootopia 的淺藍灰 */
        --zt-bg-light: #e8ecf1;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        font-family: "Noto Sans TC", sans-serif;
        background-color: var(--zt-bg-light);

        /* 🚀 ***核心重點：只放一張全螢幕大圖*** */
        background-image: var(--zt-bg-pattern-base64);
        background-repeat: no-repeat; /* 不重複 */
        background-size: center; /* 拉滿整個螢幕 */
        background-position: center 5%; /* 固定置中 */
        background-attachment: fixed; /* 捲動時不跟著動（比較穩定的視覺效果）*/

        min-height: 100vh;
        color: var(--zt-dark);
        overflow-x: hidden;
        padding-bottom: 20px;
      }

      /* 讓所有卡片背景稍微更透明，以便能透出底圖，增加層次感 */
      .hero-card,
      .mini-card {
        background: rgba(255, 255, 255, 0.75); /* 稍微透明 */
      }

      .advice-item {
        /* 讓建議項目也稍微透明，透出底圖 */
        background: rgba(232, 236, 241, 0.75);
      }

      /* 頂部狀態列也需調整，避免背景圖案太過突兀 */
      .status-bar {
        background: rgba(232, 236, 241, 0.9); /* 配合 body 的背景色並略帶透明 */
        backdrop-filter: blur(5px); /* 增加一點點模糊效果 */
        position: sticky;
        top: 0;
        z-index: 100;
        border-bottom: 1px solid rgba(0, 0, 0, 0.05);
      }

      /* 頂部狀態列 - 更乾淨俐落 */
      .status-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 20px;
        /* 移除半透明模糊，改為乾淨的淺色 */
        background: var(--zt-bg-light);
        position: sticky;
        top: 0;
        z-index: 100;
        border-bottom: 1px solid rgba(0, 0, 0, 0.05); /* 輕微分隔線 */
      }

      .location-pill {
        /* 鮮明對比色 */
        background: var(--zt-green-accent);
        color: var(--zt-dark);
        padding: 6px 18px;
        border-radius: 25px; /* 更圓潤，像城市標誌 */
        font-weight: 700;
        font-size: 1.05rem;
        /* 移除旋轉，改為俐落的陰影 */
        transform: rotate(0deg);
        border: none;
        box-shadow: 0 2px 5px var(--zt-shadow-color);
      }

      .update-pill {
        font-size: 0.9rem;
        color: var(--zt-dark);
        background: rgba(0, 0, 0, 0.05); /* 淺灰色背景 */
        padding: 4px 12px;
        border-radius: 15px;
        font-weight: 500;
      }

      .container {
        padding: 20px;
        max-width: 600px;
        margin: 0 auto;
      }

      /* === 核心：今日焦點卡片 - 更現代化 === */
      .hero-card {
        background: var(--zt-card-bg);
        border-radius: 20px; /* 俐落的圓角 */
        padding: 30px 25px;
        text-align: center;
        /* 更具層次的現代陰影 */
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1), 0 1px 3px rgba(0, 0, 0, 0.05);
        border: none; /* 移除粗糙白邊 */
        margin-bottom: 25px;
        position: relative;
      }

      /* 像城市看板的標籤 */
      .hero-period {
        position: absolute;
        top: -10px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--zt-blue-main);
        color: white;
        padding: 5px 20px;
        border-radius: 15px;
        font-weight: 700;
        font-size: 1rem;
        border: none;
        box-shadow: 0 3px 0 rgba(0, 0, 0, 0.2);
      }

      .hero-temp-container {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 15px;
        margin: 15px 0 10px;
      }

      .hero-icon {
        font-size: 5rem;
        filter: drop-shadow(0 3px 0 rgba(0, 0, 0, 0.05));
        /* 保留跳動動畫，增加趣味性 */
        animation: bounce 3s infinite;
      }

      @keyframes bounce {
        0%,
        100% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(-8px); /* 稍微減少跳動幅度 */
        }
      }

      .hero-temp {
        font-size: 5rem; /* 數字再放大一點 */
        font-weight: 900;
        color: var(--zt-blue-main); /* 使用藍色強調溫度 */
        line-height: 1;
      }

      .hero-desc {
        font-size: 1.4rem;
        color: var(--zt-dark);
        margin-bottom: 25px;
        font-weight: 700;
      }

      /* === 快速建議區 - 俐落分割線 === */
      .advice-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid rgba(0, 0, 0, 0.1); /* 改為實線或細線 */
      }

      .advice-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        background: var(--zt-bg-light); /* 使用淺灰藍作為背景，增加層次 */
        padding: 15px 10px;
        border-radius: 15px;
        box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.05); /* 內陰影增加立體感 */
      }

      .advice-icon {
        font-size: 2.2rem;
        margin-bottom: 5px;
      }

      .advice-text {
        font-size: 1.2rem;
        font-weight: 700;
        color: var(--zt-dark);
        margin: 5px 0;
        line-height: 1.3;
      }

      .advice-item div:last-child {
        font-size: 0.75rem !important;
        color: #888888 !important;
        margin-top: 5px;
      }

      /* === 稍後預報：橫向滑動區 === */
      .section-title {
        font-size: 1.4rem;
        color: var(--zt-dark);
        margin-bottom: 30px;
        margin-left: 5px;
        font-weight: 900;
        text-shadow: none; /* 移除文字陰影，保持俐落 */
        text-align: center;
        margin-top: -30px;
      }

      .scroll-container {
        display: flex;
        overflow-x: auto;
        gap: 15px;
        padding-bottom: 10px;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }

      .scroll-container::-webkit-scrollbar {
        display: none;
      }

      .mini-card {
        min-width: 130px;
        background: var(--zt-card-bg);
        border-radius: 20px;
        padding: 20px 15px;
        text-align: center;
        border: 1px solid rgba(0, 0, 0, 0.1); /* 細邊框 */
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        flex-shrink: 0;
        background: rgba(255, 255, 255, 0.8);
      }

      .mini-time {
        /* 使用輔助色強調時間區塊 */
        background: var(--zt-blue-main);
        color: white;
        padding: 4px 12px;
        border-radius: 15px;
        font-size: 0.9rem;
        display: inline-block;
        margin-bottom: 10px;
        font-weight: 700;
      }

      .mini-icon {
        font-size: 2.5rem;
        margin: 5px 0;
      }

      .mini-temp {
        font-size: 1.2rem;
        font-weight: 800;
        color: var(--zt-dark);
      }

      .mini-card div:last-child {
        font-size: 0.8rem;
        color: #888;
        margin-top: 5px;
        font-weight: 500;
      }

      /* Loading 畫面 - 改為城市色 */
      .loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--zt-blue-main); /* 使用主藍色作為 Loading 背景 */
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 999;
      }
    </style>
  </head>

  <body>
    <div id="loading" class="loading-screen">
      <div style="font-size: 4rem; animation: bounce 2s infinite">🚨</div>
      <p style="color: white; font-weight: bold; margin-top: 20px">
        正在啟動氣候觀測系統...
      </p>
    </div>
    <div class="status-bar">
      <div class="location-pill">🚨 Kaohsiung Z.P.D.</div>
      <div id="updateTime" class="update-pill">觀測時間...</div>
    </div>

    <div class="container" id="mainContent" style="display: none">
      <div id="heroCard"></div>

      <h3 class="section-title">🕒 城市警報系統預報</h3>
      <div class="scroll-container" id="futureForecasts"></div>
    </div>

    <script>
      const API_URL =
        "https://weater-kaohsiung.zeabur.app/api/weather/kaohsiung";

      function getWeatherIcon(weather) {
        // 增加一些城市感的圖示，但主要仍是天氣
        if (!weather) return "🏙️";
        if (weather.includes("晴")) return "🌞";
        if (weather.includes("多雲")) return "🌥️";
        if (weather.includes("陰")) return "☁️";
        if (weather.includes("雨")) return "🌧️";
        if (weather.includes("雷")) return "⚡️"; // 閃電比雷陣雨更俐落
        return "🏙️";
      }

      function getAdvice(rainProb, maxTemp) {
        let rainIcon = "🚫";
        let rainText = "城市巡邏免雨具";
        if (parseInt(rainProb) > 30) {
          rainIcon = "☂️";
          rainText = "朱蒂，帶上雨傘！"; // 使用角色名稱
        }

        let clothIcon = "👔";
        let clothText = "尼克，俐落穿搭"; // 使用角色名稱
        if (parseInt(maxTemp) >= 28) {
          clothIcon = "😎";
          clothText = "超級熱！墨鏡出動";
        } else if (parseInt(maxTemp) <= 20) {
          clothIcon = "🧥";
          clothText = "加件外套，小心感冒";
        }

        return { rainIcon, rainText, clothIcon, clothText };
      }

      function getTimePeriod(startTime) {
        const hour = new Date(startTime).getHours();
        if (hour >= 5 && hour < 11) return "上午時段";
        if (hour >= 11 && hour < 14) return "午餐時段";
        if (hour >= 14 && hour < 18) return "下午時段";
        if (hour >= 18 && hour < 23) return "夜間警備";
        return "深夜時段";
      }

      function renderWeather(data) {
        const forecasts = data.forecasts;
        const current = forecasts[0];
        const others = forecasts.slice(1);

        // 1. 渲染 Hero Card (主畫面)
        const advice = getAdvice(current.rain, current.maxTemp);
        const period = getTimePeriod(current.startTime);
        const avgTemp = Math.round(
          (parseInt(current.maxTemp) + parseInt(current.minTemp)) / 2
        );

        document.getElementById("heroCard").innerHTML = `
      	<div class="hero-card">
      		<div class="hero-period">${period}</div>
      		<div class="hero-temp-container">
      			<div class="hero-icon">${getWeatherIcon(current.weather)}</div>
      			<div class="hero-temp">${avgTemp}°</div>
      		</div>
      		<div class="hero-desc">氣候狀況：${current.weather}</div>

      		<div class="advice-grid">
      			<div class="advice-item">
      				<div class="advice-icon">${advice.rainIcon}</div>
      				<div class="advice-text">${advice.rainText}</div>
      				<div>降雨率 ${current.rain}</div>
      			</div>
      			<div class="advice-item">
      				<div class="advice-icon">${advice.clothIcon}</div>
      				<div class="advice-text">${advice.clothText}</div>
      				<div>最高溫 ${current.maxTemp}°</div>
      			</div>
      		</div>
      	</div>
      `;

        // 2. 渲染稍後預報 (包含明天判斷)
        const scrollContainer = document.getElementById("futureForecasts");
        scrollContainer.innerHTML = "";

        // 抓今天的日期數字 (例如 24)
        const todayDate = new Date().getDate();

        others.forEach((f) => {
          let p = getTimePeriod(f.startTime);

          // 判斷該預報的日期是否跟今天不同，不同就是明天
          const fDate = new Date(f.startTime);
          if (fDate.getDate() !== todayDate) {
            p = "明日 " + p;
          }

          scrollContainer.innerHTML += `
      		<div class="mini-card">
      			<div class="mini-time">${p}</div>
      			<div class="mini-icon">${getWeatherIcon(f.weather)}</div>
      			<div class="mini-temp">${f.minTemp}° - ${f.maxTemp}°</div>
      			<div>💧 ${f.rain}</div>
      		</div>
      	`;
        });

        // 3. 右上角顯示今日日期
        const now = new Date();
        const month = now.getMonth() + 1;
        const date = now.getDate();
        const dayIndex = now.getDay();
        const days = ["週日", "週一", "週二", "週三", "週四", "週五", "週六"];

        document.getElementById(
          "updateTime"
        ).textContent = `${month}/${date} ${days[dayIndex]} (ZPD)`;
      }

      async function fetchWeather() {
        try {
          // 1. 定義「最低等待時間」：1500 毫秒 (1.5秒)
          const delayPromise = new Promise((resolve) =>
            setTimeout(resolve, 1500)
          );

          // 2. 定義「抓取資料」的工作
          const fetchPromise = fetch(API_URL).then((res) => res.json());

          // 3. Promise.all 會等待「兩個都完成」才會往下走
          // result 陣列裡，第一個是 delay 的結果(沒用到)，第二個是 api 的 json 資料
          const [_, json] = await Promise.all([delayPromise, fetchPromise]);

          if (json.success) {
            renderWeather(json.data);

            // 資料處理好後，隱藏 Loading，顯示主畫面
            document.getElementById("loading").style.display = "none";
            document.getElementById("mainContent").style.display = "block";
          } else {
            throw new Error("API Error");
          }
        } catch (e) {
          console.error(e);
          // 錯誤提示也使用角色口吻
          alert("天氣資料讀取失敗，狐狸尼克偷走電纜了！");
        }
      }

      document.addEventListener("DOMContentLoaded", fetchWeather);
    </script>
  </body>
</html>
